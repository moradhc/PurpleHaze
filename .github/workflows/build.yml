name: Build Purple Haze (IPA sin firmar para TrollStore)

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    name: Compilar IPA
    runs-on: macos-15
    steps:
      - name: Checkout (con submodulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Seleccionar el Xcode mas nuevo
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Archivar (sin firma de Apple)
        run: |
          xcodebuild archive \
            -project PurpleHaze.xcodeproj \
            -scheme "Purple Haze" \
            -configuration Release \
            -archivePath PurpleHaze \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=14.0

      - name: Fake sign (entitlements para jailbreak / TrollStore)
        run: |
          sed 's/$(PRODUCT_BUNDLE_PREFIX:default=com.osy86)/com.osy86/g' PurpleHaze/PurpleHaze.entitlements > PurpleHaze.entitlements
          sed 's/$(PRODUCT_BUNDLE_PREFIX:default=com.osy86)/com.osy86/g' Extension/Iodine.entitlements > Iodine.entitlements
          APP="PurpleHaze.xcarchive/Products/Applications/Purple Haze.app"
          codesign --force --sign - --entitlements "Iodine.entitlements" --timestamp=none "$APP/PlugIns/Iodine.appex"
          codesign --force --sign - --entitlements "PurpleHaze.entitlements" --timestamp=none "$APP"

      - name: Empaquetar IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R "PurpleHaze.xcarchive/Products/Applications/Purple Haze.app" "Payload/Purple Haze.app"
          zip -r PurpleHaze.ipa Payload -x "._*" -x ".DS_Store" -x "__MACOSX"
          ls -la PurpleHaze.ipa

      - name: Subir el IPA
        uses: actions/upload-artifact@v4
        with:
          name: PurpleHaze-ipa
          path: PurpleHaze.ipa
          if-no-files-found: error
